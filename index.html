<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Protected Access</title>
<style>
  :root{--accent:#4f8cff;--err:#ff5470;--ok:#2ed573;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       background:radial-gradient(circle at 30% 20%,#1b2140,#0b0e18 70%);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       color:#e8ecf5;padding:20px}
  .card{width:100%;max-width:380px;background:#181c2f;border:1px solid #262c47;
        border-radius:18px;padding:32px 26px;text-align:center;
        box-shadow:0 20px 60px rgba(0,0,0,.55)}
  .lock{font-size:40px;line-height:1}
  h1{font-size:19px;margin:14px 0 6px;font-weight:600}
  p.sub{margin:0 0 22px;font-size:13.5px;color:#8f9ab5}

  /* password wrapper + show/hide toggle */
  .pw-wrap{position:relative}
  .pw-wrap input{width:100%;padding:13px 46px 13px 14px;border-radius:11px;
        border:1px solid #2e3554;background:#111527;color:#e8ecf5;
        font-size:15px;outline:none;transition:.2s}
  .pw-wrap input:focus{border-color:var(--accent);
        box-shadow:0 0 0 3px rgba(79,140,255,.18)}
  .toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);
        width:34px;height:34px;border:0;background:transparent;color:#8f9ab5;
        cursor:pointer;display:grid;place-items:center;border-radius:8px;
        padding:0;transition:.15s}
  .toggle:hover{color:#e8ecf5;background:rgba(255,255,255,.06)}
  .toggle svg{width:20px;height:20px;display:block}

  #btn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:11px;
       background:linear-gradient(135deg,#4f8cff,#6a5cff);color:#fff;font-size:15px;
       font-weight:600;cursor:pointer;transition:.2s}
  #btn:hover{filter:brightness(1.08)}
  #btn:disabled{opacity:.5;cursor:not-allowed}

  .msg{min-height:18px;margin:14px 0 0;font-size:13px;color:var(--err)}
  .msg.ok{color:var(--ok)}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style>
</head>
<body>
<div class="card">
  <div class="lock">🔒</div>
  <h1>Protected Document</h1>
  <p class="sub">Enter the password to open the Google Sheet</p>

  <form id="form" autocomplete="off">
    <div class="pw-wrap">
      <input id="pw" type="password" placeholder="Password" autofocus>
      <button id="toggle" class="toggle" type="button"
              aria-label="Show password" title="Show password">
        <!-- eye (hidden state) -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <button id="btn" type="submit">Unlock &amp; Open</button>
  </form>

  <p class="msg" id="msg"></p>
</div>

<script>
/* ==========================================================
   CONFIG
   ========================================================== */
const SHEET_URL = "https://docs.google.com/spreadsheets/d/1tTBv7DNrUzCVGns_dBX9RGmaFqoxuPqUzdZwKkieWu8/edit?usp=sharing";
const PASSWORD  = "Neeraj@5152";   // change this if needed

const REMEMBER_FOR_SESSION = true; // skip prompt for this browser tab
const MAX_ATTEMPTS = 5;
const LOCKOUT_MS   = 60 * 1000;    // 60 seconds
/* ========================================================== */

const form  = document.getElementById('form');
const pwIn  = document.getElementById('pw');
const btn   = document.getElementById('btn');
const msg   = document.getElementById('msg');
const toggle = document.getElementById('toggle');

/* ---------- show / hide password (Google Keep style) ---------- */
const EYE_OPEN = `
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
    <circle cx="12" cy="12" r="3"/>
  </svg>`;

const EYE_OFF = `
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.8 21.8 0 0 1 5.06-5.94"/>
    <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.8 21.8 0 0 1-3.16 4.19"/>
    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
    <line x1="1" y1="1" x2="23" y2="23"/>
  </svg>`;

function setPasswordVisible(show) {
  pwIn.type = show ? 'text' : 'password';
  toggle.innerHTML = show ? EYE_OFF : EYE_OPEN;
  toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  toggle.title = show ? 'Hide password' : 'Show password';
  pwIn.focus();
}

toggle.addEventListener('click', () => {
  setPasswordVisible(pwIn.type === 'password');
});
/* ------------------------------------------------------------- */

/* Already unlocked in this tab? */
if (REMEMBER_FOR_SESSION && sessionStorage.getItem('unlocked') === '1') {
  location.replace(SHEET_URL);
}

let attempts = 0, lockedUntil = 0;

form.addEventListener('submit', (e) => {
  e.preventDefault();
  msg.className = 'msg';
  msg.textContent = '';

  if (Date.now() < lockedUntil) {
    msg.textContent = `Too many attempts. Try again in ${Math.ceil((lockedUntil - Date.now())/1000)}s.`;
    return;
  }

  const value = pwIn.value;
  if (!value) { msg.textContent = 'Please enter a password.'; return; }

  // Open the tab now (avoids popup blocking)
  const win = window.open('about:blank', '_blank');

  btn.disabled = true;

  if (value === PASSWORD) {
    msg.className = 'msg ok';
    msg.textContent = 'Correct — opening…';
    if (REMEMBER_FOR_SESSION) sessionStorage.setItem('unlocked', '1');
    if (win) win.location.replace(SHEET_URL);
    else     location.href = SHEET_URL;
  } else {
    if (win) win.close();
    attempts++;
    if (attempts >= MAX_ATTEMPTS) {
      lockedUntil = Date.now() + LOCKOUT_MS;
      attempts = 0;
      msg.textContent = `Too many wrong attempts. Locked for ${LOCKOUT_MS/1000}s.`;
    } else {
      msg.textContent = `Wrong password. ${MAX_ATTEMPTS - attempts} attempt(s) left.`;
    }
    pwIn.classList.add('shake');
    setTimeout(() => pwIn.classList.remove('shake'), 400);
    pwIn.value = '';
    pwIn.focus();
  }

  btn.disabled = false;
});
</script>
</body>
</html>
